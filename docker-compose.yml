services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sigasj-sqlserver
    restart: unless-stopped
    ports:
      - '1435:1433'
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-SigasjDev2026}
    volumes:
      - sigasj_mssql_data:/var/opt/mssql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  sigasj_mssql_data:
